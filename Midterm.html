<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no">
    <title>Map of Breweries and Festivals</title>
   <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/css/main.css">

    <style>
        html,
        body,
        #map {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 99;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        #controls label {
            display: block;
            margin-bottom: 5px;
        }
    </style>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/css/main.css">
    <script type="text/javascript" src="jquery-1.11.1.min.js"></script>
</head>


<body>

    <div id="map"></div>
    <div id="map" class="map">
    </div>
    <div id="controls">
        <label>
            <input type="checkbox" id="breweries" checked>
            Breweries
        </label>

        <label>
            <input type="checkbox" id="festivals" checked>
            Festivals
        </label>
    </div>

    <script type="module" src="map.js"></script>


</body>

</html>
